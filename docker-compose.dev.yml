x-app: &app
  build: .
  image: immich-album-sync:local
  restart: unless-stopped
  volumes:
    - ./:/var/www/html
  environment: &app-env
    APP_ENV: local
    APP_DEBUG: "true"
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/www/html/database/database.sqlite
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    LOG_CHANNEL: stack
    AUTORUN_ENABLED: "false"

services:
  app:
    <<: *app
    ports:
      - "47283:8080"
    environment:
      <<: *app-env
      APP_URL: http://localhost:47283
      PHP_OPCACHE_ENABLE: "1"
      SSL_MODE: "off"
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=1800", "--sleep=3"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started
